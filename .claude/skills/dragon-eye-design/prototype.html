<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dragon Eye — Cryptid Investigation Files</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/themes.css">
<link rel="stylesheet" href="styles/hero.css">
<link rel="stylesheet" href="styles/files.css">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='32' rx='30' ry='14' fill='none' stroke='%23000' stroke-width='3'/><circle cx='32' cy='32' r='11' fill='%23000'/><ellipse cx='32' cy='32' rx='4' ry='10' fill='white'/></svg>">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>

<div id="root"></div>

<script src="src/data.js"></script>
<script type="text/babel">
// The components below are the same as src/shared.jsx, src/hero.jsx and src/files.jsx.
// They are inlined because Babel can't fetch external .jsx files when this page is
// opened straight from disk (file://). Change both copies together.
const { useState, useEffect, useMemo } = React;

// ============================================================
// DRAGON EYE EMBLEM — dragon eye SVG mark
// ============================================================
window.DragonEyeMark = function DragonEyeMark({ size = 34, style = {} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none" style={style}>
      <ellipse cx="32" cy="32" rx="30" ry="14" stroke="currentColor" strokeWidth="2.5" fill="none"/>
      <circle cx="32" cy="32" r="11" fill="currentColor"/>
      <ellipse cx="32" cy="32" rx="4" ry="10" fill="#000"/>
      <circle cx="29" cy="28" r="2" fill="#fff"/>
    </svg>
  );
};

// ============================================================
// CLASSIFIED MARQUEE BAR
// ============================================================
window.ClassifiedBar = function ClassifiedBar() {
  const msg = "// CLASSIFIED — DRAGON EYE AGENCY — LEVEL 5 CLEARANCE REQUIRED — INTERNAL USE ONLY — DO NOT DISTRIBUTE — ";
  const content = msg.repeat(6);
  return (
    <div className="de-classbar">
      <div className="de-classbar-track">{content}{content}</div>
    </div>
  );
};

// ============================================================
// NAV
// ============================================================
window.Nav = function Nav() {
  return (
    <nav className="de-nav">
      <div className="de-wrap de-nav-inner">
        <div className="de-logo">
          <window.DragonEyeMark size={30} />
          <span>Dragon Eye</span>
        </div>
        <div className="de-nav-links">
          <a href="#files">Files</a>
          <a href="#about">About</a>
          <a href="#merch">Evidence Locker</a>
        </div>
      </div>
    </nav>
  );
};

// ============================================================
// DANGER PILL
// ============================================================
window.DangerPill = function DangerPill({ level }) {
  const cls = `de-danger-pill de-danger-${level.toLowerCase()}`;
  return (
    <span className={cls}>
      <span className="de-danger-dot"/>
      {level}
    </span>
  );
};

// ============================================================
// HERO — Cryptid of the Month (Dossier: case file tossed on a desk)
// ============================================================
window.Hero = function Hero({ featured, onOpen }) {
  const today = new Date().toISOString().slice(0,10);
  return (
    <section className="de-hero hero-secret">
      <div className="de-wrap">
        <div className="hero-secret-grid">
          <div>
            <div className="hero-secret-meta">
              <span>DOSSIER № {featured.caseNumber}</span>
              <span>FILED {today}</span>
              <span>CLEARANCE // LVL 5</span>
            </div>
            <h1 className="de-title-xl" style={{marginTop: '0.2em'}}>
              CRYPTID<br/>OF THE<br/>MONTH.
            </h1>
            <p className="de-hero-sub">
              Thirteen active investigations. One creature selected for deep file review.
              This month the Dragon Eye Agency turns its glass on <b>{featured.name}</b> —
              {featured.alias ? ` also known as ${featured.alias.split(",")[0]}.` : "."}
            </p>
            <div style={{display:'flex', gap:'1rem', marginTop:'2rem', flexWrap:'wrap'}}>
              <button className="de-btn de-btn-primary" onClick={onOpen}>
                ▸ Open Dossier
              </button>
              <a className="de-btn" href="#files">Browse All Files</a>
            </div>
          </div>
          <div className="hero-secret-dossier">
            <div className="hero-secret-folder">
              <div className="hero-secret-tab">CASE {featured.caseNumber}</div>
              <img src={featured.image} alt={featured.name} className="hero-secret-photo" />
              <div className="hero-secret-stamps">
                <div className="de-stamp" style={{transform:'rotate(-6deg)'}}>TOP SECRET</div>
                <div className="de-stamp" style={{transform:'rotate(4deg)', marginTop:'-8px', color:'var(--de-accent-2)', borderColor:'var(--de-accent-2)'}}>EYES ONLY</div>
              </div>
              <div className="hero-secret-caption">
                <div className="de-mono-label">SUBJECT</div>
                <div style={{fontFamily:'var(--de-display)', fontSize:'2rem', lineHeight:1}}>{featured.name}</div>
                <div className="de-mono-label" style={{marginTop:'6px'}}>
                  LOCATION · {featured.region} · FIRST SEEN · {featured.firstSighting}
                </div>
              </div>
              <window.DangerPill level={featured.dangerLevel} />
            </div>
            <div className="hero-secret-paperclip"/>
          </div>
        </div>
      </div>
    </section>
  );
};

// ============================================================
// FILES SECTION — search, filter, grid, modal open (Dossier)
// ============================================================
window.FilesSection = function FilesSection({ cryptids, onOpen }) {
  const [q, setQ] = useState("");
  const [region, setRegion] = useState("all");
  const [danger, setDanger] = useState("all");

  const regions = useMemo(() => {
    const set = new Set(cryptids.map(c => c.region));
    return ["all", ...Array.from(set)];
  }, [cryptids]);

  const dangers = ["all", "Low", "Medium", "High", "Unknown"];

  const filtered = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return cryptids.filter(c => {
      if (region !== "all" && c.region !== region) return false;
      if (danger !== "all" && c.dangerLevel !== danger) return false;
      if (!needle) return true;
      return (c.name + " " + c.codename + " " + c.region + " " + c.type + " " + (c.alias||""))
        .toLowerCase().includes(needle);
    });
  }, [cryptids, q, region, danger]);

  return (
    <section className="de-section files-section" id="files">
      <div className="de-wrap">
        <div className="de-section-head">
          <div>
            <div className="de-eyebrow">Case Archive</div>
            <h2 className="de-section-title">Classified Database</h2>
          </div>
          <p style={{maxWidth:'36ch', fontFamily:'var(--de-body)', fontSize:'1rem', lineHeight:1.4, margin:0, color:'var(--de-ink-soft)'}}>
            {cryptids.length} subjects. Browse by region or threat level. Clearance checks apply.
          </p>
        </div>

        <div className="de-search-row">
          <div className="files-search">
            <span className="files-search-icon">⌕</span>
            <input
              className="de-input"
              type="text"
              placeholder="SEARCH SUBJECT, CODENAME, REGION"
              value={q}
              onChange={e => setQ(e.target.value)}
            />
          </div>
          <select className="de-input" value={region} onChange={e => setRegion(e.target.value)}>
            {regions.map(r => <option key={r} value={r}>{r === 'all' ? 'ALL REGIONS' : r}</option>)}
          </select>
          <select className="de-input" value={danger} onChange={e => setDanger(e.target.value)}>
            {dangers.map(d => <option key={d} value={d}>{d === 'all' ? 'ALL THREAT LEVELS' : d.toUpperCase()}</option>)}
          </select>
        </div>

        <div className="de-mono-label" style={{marginBottom:'1rem'}}>
          {filtered.length} / {cryptids.length} files found
        </div>

        {filtered.length === 0 ? (
          <div style={{padding:'3rem', textAlign:'center', border:'1px dashed var(--de-ink-soft)', fontFamily:'var(--de-mono)'}}>
            NO RECORDS MATCH QUERY
          </div>
        ) : (
          <div className="de-files-grid">
            {filtered.map((c, i) => (
              <FileCard key={c.slug} cryptid={c} i={i} onOpen={() => onOpen(c)} />
            ))}
          </div>
        )}
      </div>
    </section>
  );
};

function FileCard({ cryptid, i, onOpen }) {
  return (
    <article
      className="de-card"
      style={{animationDelay: `${i * 40}ms`}}
      onClick={onOpen}
    >
      <div className="de-card-img-wrap">
        <img src={cryptid.image} alt={cryptid.name} className="de-card-img" loading="lazy" />
        <div className="card-secret-stamp">
          <div className="de-mono-label" style={{color:'var(--de-paper)'}}>№ {cryptid.caseNumber}</div>
        </div>
      </div>
      <div className="de-card-info">
        <h3 className="de-card-name">{cryptid.name}</h3>
        <div className="de-card-meta">
          <span>{cryptid.type}</span>
          <window.DangerPill level={cryptid.dangerLevel}/>
        </div>
        <div className="de-card-region">LOC · {cryptid.region}</div>
      </div>
    </article>
  );
}

// ============================================================
// MODAL — full case file (Dossier)
// ============================================================
window.FileModal = function FileModal({ cryptid, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [onClose]);

  if (!cryptid) return null;

  return (
    <div className="de-modal-backdrop" onClick={onClose}>
      <div className="de-modal de-modal-secret" onClick={e => e.stopPropagation()}>
        <button className="de-modal-close" onClick={onClose} aria-label="Close">✕</button>
        <ModalSecret c={cryptid}/>
      </div>
    </div>
  );
};

function ModalSecret({ c }) {
  return (
    <div className="modal-secret">
      <div className="modal-secret-header">
        <div>
          <div className="de-mono-label">DOSSIER №</div>
          <div style={{fontFamily:'var(--de-label)', fontSize:'1.4rem'}}>{c.caseNumber}</div>
        </div>
        <div className="de-stamp">{c.status.toUpperCase()}</div>
        <div style={{textAlign:'right'}}>
          <div className="de-mono-label">CLEARANCE</div>
          <div style={{fontFamily:'var(--de-label)', fontSize:'1.4rem'}}>LVL 5</div>
        </div>
      </div>

      <div className="modal-secret-body">
        <div>
          <img src={c.image} alt={c.name} className="modal-secret-photo"/>
          <div className="de-mono-label" style={{marginTop:'8px'}}>PHOTOGRAPHIC EVIDENCE · EXHIBIT A</div>
        </div>
        <div>
          <h2 style={{fontFamily:'var(--de-display)', fontSize:'3rem', margin:'0 0 8px', lineHeight:1}}>{c.name}</h2>
          <div style={{display:'flex', gap:'8px', marginBottom:'1rem'}}>
            <window.DangerPill level={c.dangerLevel}/>
          </div>
          <dl className="modal-secret-dl">
            <dt>Codename</dt><dd>{c.codename}</dd>
            <dt>Type</dt><dd>{c.type}</dd>
            <dt>Region</dt><dd>{c.region}</dd>
            <dt>First Sighting</dt><dd>{c.firstSighting}</dd>
            <dt>Alias</dt><dd>{c.alias || '—'}</dd>
            <dt>Associates</dt><dd>{c.knownAssociates || '—'}</dd>
          </dl>
          <div className="de-mono-label" style={{marginTop:'1.2rem'}}>INVESTIGATOR CASE NOTES</div>
          <p style={{fontFamily:'var(--de-body)', lineHeight:1.6, marginTop:'6px'}}>{c.description}</p>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// APP — root component
// ============================================================
function App() {
  const [open, setOpen] = useState(null);
  const featured = window.CRYPTIDS.find(c => c.slug === window.FEATURED_SLUG) || window.CRYPTIDS[0];

  return (
    <>
      <window.ClassifiedBar/>
      <window.Nav/>
      <window.Hero featured={featured} onOpen={() => setOpen(featured)}/>
      <window.FilesSection cryptids={window.CRYPTIDS} onOpen={setOpen}/>

      <section className="de-about de-section" id="about">
        <div className="de-wrap de-about-grid">
          <div>
            <div className="de-eyebrow">Who we are</div>
            <h2 className="de-section-title">About Dragon Eye</h2>
          </div>
          <div className="de-about-card">
            <p style={{fontFamily:'var(--de-body)', fontSize:'1.05rem', lineHeight:1.6, margin:'0 0 1rem'}}>
              Dragon Eye is a kid-friendly agency, ages 8 to 13. We snoop around town and look for clues during school hours on Mondays and Wednesdays.
            </p>
            <p style={{fontFamily:'var(--de-body)', fontSize:'1.05rem', lineHeight:1.6, margin:'0 0 1rem'}}>
              Strategy meetings every Monday and Wednesday morning — exclusive to Dragon Eye members.
            </p>
            <p style={{fontFamily:'var(--de-body)', fontSize:'1.05rem', lineHeight:1.6, margin:0}}>
              We meet at Dragon Eye HQ, in the heart of the city. Address classified.
            </p>
          </div>
        </div>
      </section>

      <footer className="de-footer">
        <div className="de-wrap de-footer-inner">
          <div>© 2026 Dragon Eye Agency · All files classified</div>
          <div>{window.CRYPTIDS.length} active cases · Last updated 04.18.2026</div>
        </div>
      </footer>

      {open && <window.FileModal cryptid={open} onClose={() => setOpen(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
